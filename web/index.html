<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>KRISIS — Treino de entrevistas</title>
    <script>
      // Aplica o tema antes de pintar a página, para não piscar.
      (function () {
        var pref = 'sistema';
        try { pref = localStorage.getItem('krisis.tema') || 'sistema'; } catch (e) {}
        var dark = pref === 'escuro' || (pref === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'escuro' : 'claro';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
