<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>KRISIS — Entrevista</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.92}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #B8307A;outline-offset:2px}
@keyframes kpulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes kdot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: 'DM Sans', sans-serif; display: flex; flex-wrap: wrap">

  <dc-import name="Sidebar" tema="{{tema}}" ativo="e1" hint-size="280px,900px"></dc-import>

  <main style="flex: 999 1 560px; min-width: 0; min-height: 900px; display: flex; flex-direction: column">

    <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding: 16px 28px; border-bottom: 1px solid {{t.line}}; background: {{t.headerBg}}">
      <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
        <h1 style="margin: 0; font: 600 20px/1.2 'Manrope', sans-serif; letter-spacing: -.02em">Engenheiro de dados</h1>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <span style="padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{t.chip}}; color: {{t.accent}}">Sênior</span>
          <span style="padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{t.chip}}; color: {{t.accent}}">Técnica</span>
          <span style="padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{t.chip}}; color: {{t.accent}}">[Empresa]</span>
          <span style="padding: 3px 10px; border-radius: 999px; font-size: 12px; border: 1px solid {{t.line}}; color: {{t.muted}}">Motores: Groq · Kokoro</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <a href="Feedback.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid {{t.lineStrong}}; color: {{t.text}}; font-size: 13px; font-weight: 700; text-decoration: none">Encerrar e ver feedback</a>
      </div>
    </header>

    <section aria-label="Conversa" style="flex: 1; overflow-y: auto; padding: 32px 28px">
      <div style="max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px">
        <sc-for list="{{mensagens}}" as="m" hint-placeholder-count="4">
          <sc-if value="{{m.entrevistador}}" hint-placeholder-val="{{true}}">
            <article style="display: flex; gap: 12px; align-items: flex-start; max-width: 680px">
              <div style="flex: none; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: {{t.panel}}; border: 1px solid {{t.line}}">
                <img src="/_blob/cd37d9e4d9442174fee4aa7c59ceca29" alt="" style="width: 22px; height: 22px; object-fit: contain">
              </div>
              <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
                <span style="font-size: 12px; font-weight: 700; color: {{t.muted}}">Entrevistador</span>
                <div style="padding: 14px 18px; border-radius: 4px 18px 18px 18px; background: {{t.panel}}; border: 1px solid {{t.line}}; box-shadow: {{t.shadowSoft}}; font-size: 15px; line-height: 1.65">{{m.texto}}</div>
                <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
                  <sc-if value="{{m.tocando}}" hint-placeholder-val="{{false}}">
                    <span style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px; background: {{t.falandoFundo}}; color: {{t.falandoCor}}; font-size: 12px; font-weight: 700">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"></path></svg>Tocando áudio
                    </span>
                  </sc-if>
                  <sc-if value="{{m.parado}}" hint-placeholder-val="{{true}}">
                    <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid {{t.line}}; background: transparent; color: {{t.muted}}; font: 600 12px 'DM Sans', sans-serif; cursor: pointer">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>Ouvir de novo
                    </button>
                  </sc-if>
                  <span style="font-size: 11px; color: {{t.muted}}">{{m.tempos}}</span>
                </div>
              </div>
            </article>
          </sc-if>
          <sc-if value="{{m.candidato}}" hint-placeholder-val="{{false}}">
            <article style="align-self: flex-end; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; max-width: 620px">
              <span style="font-size: 12px; font-weight: 700; color: {{t.muted}}">Você</span>
              <div style="padding: 14px 18px; border-radius: 18px 4px 18px 18px; background: {{t.minha}}; border: 1px solid {{t.minhaBorda}}; font-size: 15px; line-height: 1.65">{{m.texto}}</div>
              <span style="font-size: 11px; color: {{t.muted}}">{{m.tempos}}</span>
            </article>
          </sc-if>
        </sc-for>

        <sc-if value="{{pensando}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; gap: 12px; align-items: center" aria-live="polite">
            <div style="flex: none; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: {{t.panel}}; border: 1px solid {{t.line}}">
              <img src="/_blob/cd37d9e4d9442174fee4aa7c59ceca29" alt="" style="width: 22px; height: 22px; object-fit: contain">
            </div>
            <div style="display: flex; gap: 6px; padding: 16px 18px; border-radius: 4px 18px 18px 18px; background: {{t.panel}}; border: 1px solid {{t.line}}" aria-label="O entrevistador está pensando">
              <span style="width: 7px; height: 7px; border-radius: 50%; background: {{t.accent}}; animation: kdot 1.2s infinite"></span>
              <span style="width: 7px; height: 7px; border-radius: 50%; background: {{t.accent}}; animation: kdot 1.2s .15s infinite"></span>
              <span style="width: 7px; height: 7px; border-radius: 50%; background: {{t.accent}}; animation: kdot 1.2s .3s infinite"></span>
            </div>
          </div>
        </sc-if>
      </div>
    </section>

    <footer style="border-top: 1px solid {{t.line}}; background: {{t.headerBg}}; padding: 16px 28px 22px">
      <div style="max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; justify-content: center">
          <span role="status" aria-live="polite" style="display: inline-flex; align-items: center; gap: 10px; padding: 7px 14px; border-radius: 999px; background: {{t.panel}}; border: 1px solid {{t.line}}; font-size: 13px; font-weight: 600">
            <span style="width: 9px; height: 9px; border-radius: 50%; background: {{status.cor}}; animation: {{status.anim}}"></span>{{status.texto}}
          </span>
        </div>
        <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
          <button type="button" onClick="{{acaoMic}}" disabled="{{ocupado}}" aria-label="{{mic.rotulo}}" style="flex: none; display: inline-flex; align-items: center; gap: 12px; height: 64px; padding: 0 26px 0 8px; border-radius: 999px; border: 0; background: {{mic.fundo}}; color: #FFFFFF; font: 700 15px 'DM Sans', sans-serif; cursor: {{mic.cursor}}; box-shadow: {{mic.sombra}}">
            <span style="width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.18)">
              <sc-if value="{{gravando}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg></sc-if>
              <sc-if value="{{naoGravando}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"></path><path d="M19 11a7 7 0 0 1-14 0M12 18v3"></path></svg></sc-if>
            </span>
            {{mic.rotulo}}
          </button>
          <sc-if value="{{gravando}}" hint-placeholder-val="{{false}}">
            <div aria-hidden="true" style="display: flex; align-items: center; gap: 4px; height: 40px">
              <sc-for list="{{barras}}" as="b" hint-placeholder-count="16"><span style="width: 4px; height: {{b.h}}; border-radius: 4px; background: {{t.coral}}; animation: kpulse 1s {{b.d}} infinite"></span></sc-for>
            </div>
          </sc-if>
          <form style="flex: 1 1 280px; min-width: 0; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 6px 0 18px; border-radius: 999px; border: 1px solid {{t.lineStrong}}; background: {{t.input}}">
            <label for="texto" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Responder por texto</label>
            <input id="texto" type="text" placeholder="Ou digite sua resposta…" style="flex: 1; min-width: 0; height: 100%; border: 0; outline-offset: 4px; background: transparent; color: {{t.text}}; font: 400 15px 'DM Sans', sans-serif">
            <button type="button" aria-label="Enviar resposta" style="width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; border: 0; background: {{t.chip}}; color: {{t.accent}}; cursor: pointer">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            </button>
          </form>
        </div>
      </div>
    </footer>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["claro","escuro"],"default":"claro"},"$preview":{"width":1440,"height":900}}'>
var TEMAS = {
  claro: {bg:'#FAF7FF',headerBg:'rgba(250,247,255,.92)',panel:'#FFFFFF',input:'#FFFFFF',text:'#1B1029',muted:'#5E5170',line:'rgba(91,28,162,.14)',lineStrong:'rgba(91,28,162,.26)',accent:'#7A2BD6',coral:'#C42A52',chip:'#F1E7FE',minha:'#F1E7FE',minhaBorda:'rgba(122,43,214,.22)',shadowSoft:'0 6px 18px rgba(74,32,120,.06)',ok:'#1D8A55',laranja:'#C2560E',falandoFundo:'#FDEBD9',falandoCor:'#8A3B07',desab:'#B9AEC7'},
  escuro: {bg:'#0D0718',headerBg:'rgba(13,7,24,.86)',panel:'#171025',input:'#120B1E',text:'#F7F2FF',muted:'#B8ABC9',line:'rgba(208,174,255,.16)',lineStrong:'rgba(208,174,255,.28)',accent:'#C69AFF',coral:'#FF5B7F',chip:'#2A1A3F',minha:'#241632',minhaBorda:'rgba(198,154,255,.28)',shadowSoft:'none',ok:'#57D691',laranja:'#FF8A3D',falandoFundo:'rgba(255,138,61,.16)',falandoCor:'#FFB37F',desab:'#4A3A5E'}
};
var INICIAIS = [
  {autor:'e', texto:'Olá! Obrigado por participar. Para começar, me conte sobre um projeto de dados recente em que você teve papel central.', tempos:'Modelo 0,6 s · Voz 0,8 s'},
  {autor:'c', texto:'Liderei a migração do nosso pipeline de ingestão de lote para streaming. Eram mais de cem fontes e o time de negócio precisava dos dados em minutos, não no dia seguinte.', tempos:'Voz · 0:21 · transcrição 0,4 s'},
  {autor:'e', texto:'Interessante. Qual foi a maior dificuldade técnica nessa migração e como você chegou à arquitetura final?', tempos:'Modelo 0,7 s · Voz 0,9 s'},
  {autor:'c', texto:'O mais difícil foi garantir que nenhum evento fosse processado duas vezes. Comparamos duas abordagens e escolhemos chaves idempotentes no destino, porque era mais simples de operar.', tempos:'Voz · 0:26 · transcrição 0,5 s'}
];
var NOVA_RESPOSTA = {autor:'c', texto:'Medimos a latência ponta a ponta antes e depois e acompanhamos o volume de reprocessamentos por um mês.', tempos:'Voz · 0:12 · transcrição 0,3 s'};
var NOVA_PERGUNTA = {autor:'e', texto:'Faz sentido. Se você fosse refazer esse projeto hoje, o que mudaria na arquitetura?', tempos:'Modelo 0,6 s · Voz 0,8 s'};
var BARRAS = [14,26,18,34,22,30,12,28,36,20,16,32,24,14,28,18].map(function (h, i) { return { h: h + 'px', d: (i * 0.07).toFixed(2) + 's' }; });
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tema: null, estado: 'pronto', segundos: 0, extras: [] };
    this.timers = [];
  }
  componentWillUnmount() { this.limpar(); }
  limpar() { this.timers.forEach(function (id) { clearTimeout(id); clearInterval(id); }); this.timers = []; }
  depois(ms, fn) { this.timers.push(setTimeout(fn, ms)); }
  renderVals() {
    var self = this;
    var tema = this.state.tema || this.props.tema || 'claro';
    var t = TEMAS[tema];
    var estado = this.state.estado;
    var seg = this.state.segundos;
    var tempo = '0:' + (seg < 10 ? '0' : '') + seg;
    var STATUS = {
      pronto: { texto: 'Pronto. Clique em Falar para responder.', cor: t.ok, anim: 'none' },
      gravando: { texto: 'Gravando · ' + tempo, cor: t.coral, anim: 'kpulse 1s infinite' },
      transcrevendo: { texto: 'Transcrevendo sua fala…', cor: t.accent, anim: 'kpulse 1s infinite' },
      pensando: { texto: 'O entrevistador está pensando…', cor: t.accent, anim: 'kpulse 1s infinite' },
      falando: { texto: 'Entrevistador falando', cor: t.laranja, anim: 'kpulse 1.4s infinite' }
    };
    var ocupado = estado === 'transcrevendo' || estado === 'pensando';
    var mic = estado === 'gravando'
      ? { rotulo: 'Terminei de falar', fundo: t.coral, sombra: '0 8px 28px rgba(196,42,82,.30)', cursor: 'pointer' }
      : ocupado
        ? { rotulo: 'Aguarde', fundo: t.desab, sombra: 'none', cursor: 'default' }
        : { rotulo: 'Falar', fundo: 'linear-gradient(115deg, #7A2BD6 0%, #B8307A 100%)', sombra: '0 8px 28px rgba(161,60,232,.28)', cursor: 'pointer' };
    var todas = INICIAIS.concat(this.state.extras);
    var ultimaE = -1;
    todas.forEach(function (m, i) { if (m.autor === 'e') ultimaE = i; });
    var mensagens = todas.map(function (m, i) {
      var tocando = estado === 'falando' && i === ultimaE;
      return { texto: m.texto, tempos: m.tempos, entrevistador: m.autor === 'e', candidato: m.autor === 'c', tocando: tocando, parado: !tocando };
    });
    return {
      tema: tema,
      t: t,
      isDark: tema === 'escuro',
      isLight: tema !== 'escuro',
      toggleLabel: tema === 'escuro' ? 'Mudar para o tema claro' : 'Mudar para o tema escuro',
      toggle: function () { self.setState({ tema: tema === 'escuro' ? 'claro' : 'escuro' }); },
      mensagens: mensagens,
      pensando: estado === 'pensando',
      gravando: estado === 'gravando',
      naoGravando: estado !== 'gravando',
      ocupado: ocupado,
      status: STATUS[estado],
      mic: mic,
      barras: BARRAS,
      acaoMic: function () {
        if (estado === 'pronto' || estado === 'falando') {
          self.limpar();
          self.setState({ estado: 'gravando', segundos: 0 });
          self.timers.push(setInterval(function () { self.setState({ segundos: Math.min(59, self.state.segundos + 1) }); }, 1000));
        } else if (estado === 'gravando') {
          self.limpar();
          self.setState({ estado: 'transcrevendo' });
          self.depois(1100, function () { self.setState({ estado: 'pensando', extras: self.state.extras.concat([NOVA_RESPOSTA]) }); });
          self.depois(2300, function () { self.setState({ estado: 'falando', extras: self.state.extras.concat([NOVA_PERGUNTA]) }); });
          self.depois(5300, function () { self.setState({ estado: 'pronto' }); });
        }
      }
    };
  }
}
</script>
</body>
</html>
