<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>KRISIS — Nova entrevista</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.92}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #B8307A;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 1100px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: 'DM Sans', sans-serif; display: flex; flex-wrap: wrap">

  <dc-import name="Sidebar" tema="{{tema}}" ativo="nenhum" hint-size="280px,900px"></dc-import>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <div style="padding: 48px 28px 64px">
      <form style="max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">
        <div>
          <div style="display: flex; align-items: center; gap: 10px; color: {{t.accent}}; font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase"><span style="width: 25px; height: 1px; background: {{t.coral}}"></span>Nova entrevista</div>
          <h1 style="margin: 14px 0 8px; font: 600 40px/1.1 'Manrope', sans-serif; letter-spacing: -.045em">Para qual vaga vamos treinar?</h1>
          <p style="margin: 0; color: {{t.muted}}; font-size: 15px; line-height: 1.7">Esses dados orientam o entrevistador. Quanto mais contexto, mais específicas ficam as perguntas.</p>
        </div>

        <div style="padding: 28px; border-radius: 20px; border: 1px solid {{t.line}}; background: {{t.panel}}; box-shadow: {{t.shadow}}; display: flex; flex-direction: column; gap: 22px">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px">
            <div style="display: flex; flex-direction: column; gap: 8px">
              <label for="vaga" style="font-size: 13px; font-weight: 600">Vaga</label>
              <input id="vaga" type="text" placeholder="Ex.: Engenheiro de dados" style="height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; border: 1px solid {{t.lineStrong}}; background: {{t.input}}; color: {{t.text}}; font: 400 15px 'DM Sans', sans-serif">
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <label for="empresa" style="font-size: 13px; font-weight: 600">Empresa</label>
              <input id="empresa" type="text" placeholder="Nome da empresa" style="height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; border: 1px solid {{t.lineStrong}}; background: {{t.input}}; color: {{t.text}}; font: 400 15px 'DM Sans', sans-serif">
            </div>
          </div>

          <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
            <legend style="padding: 0; margin-bottom: 10px; font-size: 13px; font-weight: 600">Nível</legend>
            <div style="display: flex; flex-wrap: wrap; gap: 8px">
              <sc-for list="{{niveis}}" as="o" hint-placeholder-count="3">
                <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.sel}}" style="height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid {{o.borda}}; background: {{o.fundo}}; color: {{o.cor}}; font: 600 14px 'DM Sans', sans-serif; cursor: pointer">{{o.rotulo}}</button>
              </sc-for>
            </div>
          </fieldset>

          <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
            <legend style="padding: 0; margin-bottom: 10px; font-size: 13px; font-weight: 600">Tipo de entrevista</legend>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px">
              <sc-for list="{{tipos}}" as="o" hint-placeholder-count="3">
                <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.sel}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px 16px; border-radius: 16px; border: 1px solid {{o.borda}}; background: {{o.fundo}}; color: {{t.text}}; text-align: left; cursor: pointer; font-family: 'DM Sans', sans-serif">
                  <span style="font: 600 15px 'Manrope', sans-serif; color: {{o.cor}}">{{o.rotulo}}</span>
                  <span style="font-size: 12px; line-height: 1.5; color: {{t.muted}}">{{o.desc}}</span>
                </button>
              </sc-for>
            </div>
          </fieldset>
        </div>

        <div style="padding: 28px; border-radius: 20px; border: 1px solid {{t.line}}; background: {{t.panel}}; box-shadow: {{t.shadow}}; display: flex; flex-direction: column; gap: 22px">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="descricao" style="font-size: 13px; font-weight: 600">Descrição da vaga <span style="font-weight: 400; color: {{t.muted}}">(opcional)</span></label>
            <textarea id="descricao" rows="5" placeholder="Cole aqui o texto do anúncio da vaga." style="box-sizing: border-box; padding: 14px 16px; border-radius: 12px; border: 1px solid {{t.lineStrong}}; background: {{t.input}}; color: {{t.text}}; font: 400 15px/1.6 'DM Sans', sans-serif; resize: vertical"></textarea>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="curriculo" style="font-size: 13px; font-weight: 600">Seu currículo <span style="font-weight: 400; color: {{t.muted}}">(opcional)</span></label>
            <textarea id="curriculo" rows="5" placeholder="Cole aqui o seu currículo em texto." style="box-sizing: border-box; padding: 14px 16px; border-radius: 12px; border: 1px solid {{t.lineStrong}}; background: {{t.input}}; color: {{t.text}}; font: 400 15px/1.6 'DM Sans', sans-serif; resize: vertical"></textarea>
          </div>
        </div>

        <div style="padding: 20px 28px; border-radius: 20px; border: 1px dashed {{t.lineStrong}}; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 13px; font-weight: 600">Motores de voz e conversa</span>
            <span style="font-size: 12px; color: {{t.muted}}">Escolha por entrevista para comparar os tempos (a partir da v1).</span>
          </div>
          <div style="display: flex; gap: 8px">
            <sc-for list="{{motores}}" as="o" hint-placeholder-count="2">
              <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.sel}}" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{o.borda}}; background: {{o.fundo}}; color: {{o.cor}}; font: 600 13px 'DM Sans', sans-serif; cursor: pointer">{{o.rotulo}}</button>
            </sc-for>
          </div>
        </div>

        <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px">
          <a href="Chat.dc.html" style="display: inline-flex; align-items: center; height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid {{t.lineStrong}}; font-size: 14px; font-weight: 700; text-decoration: none">Cancelar</a>
          <a href="Chat.dc.html" style="display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 24px; border-radius: 999px; background: linear-gradient(115deg, #7A2BD6 0%, #B8307A 100%); color: #FFFFFF; font-size: 14px; font-weight: 700; text-decoration: none; box-shadow: 0 8px 28px rgba(161,60,232,.23)">Começar entrevista <span aria-hidden="true">→</span></a>
        </div>
      </form>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["claro","escuro"],"default":"claro"},"$preview":{"width":1440,"height":1100}}'>
var TEMAS = {
  claro: {bg:'#FAF7FF',panel:'#FFFFFF',input:'#FFFFFF',text:'#1B1029',muted:'#5E5170',line:'rgba(91,28,162,.14)',lineStrong:'rgba(91,28,162,.26)',accent:'#7A2BD6',coral:'#C42A52',shadow:'0 18px 50px rgba(74,32,120,.07)',selFundo:'#F1E7FE',selBorda:'#7A2BD6'},
  escuro: {bg:'#0D0718',panel:'#171025',input:'#120B1E',text:'#F7F2FF',muted:'#B8ABC9',line:'rgba(208,174,255,.16)',lineStrong:'rgba(208,174,255,.28)',accent:'#C69AFF',coral:'#FF5B7F',shadow:'none',selFundo:'#2A1A3F',selBorda:'#C69AFF'}
};
var NIVEIS = [{id:'junior',rotulo:'Júnior'},{id:'pleno',rotulo:'Pleno'},{id:'senior',rotulo:'Sênior'}];
var TIPOS = [
  {id:'comportamental',rotulo:'Comportamental',desc:'Situações vividas, conflitos, liderança e decisões.'},
  {id:'tecnica',rotulo:'Técnica',desc:'Conhecimento da área, arquitetura e resolução de problemas.'},
  {id:'mista',rotulo:'Mista',desc:'Alterna perguntas técnicas e comportamentais.'}
];
var MOTORES = [{id:'v0',rotulo:'v0 · Groq + Kokoro'},{id:'v1',rotulo:'v1 · Google'}];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tema: null, nivel: 'senior', tipo: 'tecnica', motor: 'v0' }; }
  opcoes(lista, campo, t) {
    var self = this;
    var atual = this.state[campo];
    return lista.map(function (o) {
      var sel = o.id === atual;
      return Object.assign({}, o, {
        sel: sel,
        fundo: sel ? t.selFundo : 'transparent',
        borda: sel ? t.selBorda : t.lineStrong,
        cor: sel ? t.accent : t.text,
        pick: function () { var s = {}; s[campo] = o.id; self.setState(s); }
      });
    });
  }
  renderVals() {
    var self = this;
    var tema = this.state.tema || this.props.tema || 'claro';
    var t = TEMAS[tema];
    return {
      tema: tema,
      t: t,
      isDark: tema === 'escuro',
      isLight: tema !== 'escuro',
      toggleLabel: tema === 'escuro' ? 'Mudar para o tema claro' : 'Mudar para o tema escuro',
      toggle: function () { self.setState({ tema: tema === 'escuro' ? 'claro' : 'escuro' }); },
      niveis: this.opcoes(NIVEIS, 'nivel', t),
      tipos: this.opcoes(TIPOS, 'tipo', t),
      motores: this.opcoes(MOTORES, 'motor', t)
    };
  }
}
</script>
</body>
</html>
